<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a2420">
<title>Beacon Ride Navigator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --moss:#1a2420; --slate:#2b3a34; --mist:#e8ede9; --stone:#9fb0a7;
  --hivis:#ffb300; --hivis-deep:#e08900; --track:#ff6d00;
  --off:#d32f2f; --on:#2e7d32;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--moss)}
#app{display:flex;flex-direction:column;height:100%}

header{background:var(--moss);color:var(--mist);padding:10px 14px 8px;z-index:1000;border-bottom:2px solid var(--hivis)}
.route-name{font-size:15px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:14px;margin-top:4px;font-size:12px;color:var(--stone)}
.stats b{color:var(--hivis);font-weight:700;font-variant-numeric:tabular-nums}
.stats .live{display:none}
header.riding .static{display:none}
header.riding .live{display:inline}

#map{flex:1;background:#0e1512}
.leaflet-control-attribution{font-size:9px}

#elev{height:64px;background:var(--slate);position:relative;flex-shrink:0}
#elevCanvas{width:100%;height:100%;display:block}
#elevLabel{position:absolute;top:4px;left:10px;font-size:10px;color:var(--stone);letter-spacing:.05em;text-transform:uppercase}
#posMarker{position:absolute;top:0;bottom:0;width:2px;background:var(--hivis);display:none;pointer-events:none}

nav.actions{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--moss);flex-shrink:0}
.btn{border:0;border-radius:10px;padding:13px 8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .1s;text-align:center}
.btn:active{transform:scale(.97)}
#gpxLabel{flex:0 0 auto;background:var(--slate);color:var(--hivis);border:1px solid #45564e;display:flex;align-items:center;padding:13px 12px}
#gpxLabel input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
#btnFollow{flex:1.5;background:var(--hivis);color:var(--moss)}
#btnFollow.on{background:var(--track);color:#fff}
#btnGmaps{flex:1;background:var(--slate);color:var(--mist);border:1px solid #45564e}

#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;background:rgba(14,21,18,.92);color:var(--mist);padding:10px 16px;border-radius:8px;font-size:13px;z-index:2000;display:none;max-width:85%;text-align:center;border-left:3px solid var(--hivis)}
#startNav{position:absolute;left:12px;right:12px;top:70px;background:var(--hivis);color:var(--moss);padding:12px 14px;border-radius:10px;font-size:14px;font-weight:700;z-index:2000;display:none;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.4);cursor:pointer}
#startNav small{display:block;font-weight:400;font-size:11px;margin-top:2px;opacity:.8}

#flash{position:fixed;inset:0;z-index:3000;pointer-events:none;opacity:0}
#flash.red{animation:fl 1.6s ease-out 2;background:var(--off)}
#flash.green{animation:fl 1.2s ease-out 1;background:var(--on)}
@keyframes fl{0%{opacity:0}15%{opacity:.55}100%{opacity:0}}
#offBanner{position:absolute;left:12px;right:12px;top:70px;background:var(--off);color:#fff;padding:11px 14px;border-radius:10px;font-size:14px;font-weight:700;z-index:2100;display:none;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.4)}

#summary{position:fixed;inset:0;background:rgba(14,21,18,.9);z-index:4000;display:none;align-items:center;justify-content:center;padding:24px}
#summary .card{background:var(--slate);border:1px solid #45564e;border-radius:14px;padding:22px;width:100%;max-width:340px;color:var(--mist)}
#summary h2{font-size:15px;color:var(--hivis);letter-spacing:.05em;text-transform:uppercase;margin-bottom:14px}
#summary .row{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-bottom:1px solid #3a4a42}
#summary .row b{font-variant-numeric:tabular-nums;color:var(--hivis)}
#summary button{margin-top:16px;width:100%;background:var(--hivis);color:var(--moss)}
@media (prefers-reduced-motion:reduce){#flash.red,#flash.green{animation:none;opacity:.4;transition:opacity 1.5s}}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="route-name" id="routeName">Uncle Jefferey &amp; Brother Beacon</div>
    <div class="stats">
      <span class="static"><b id="stTotal">45.8</b> km</span>
      <span class="static"><b id="stClimb">470</b> m climb</span>
      <span class="static"><b>▲</b> <span id="stHigh">Beacon Fell 266 m</span></span>
      <span class="live"><b id="lvDone">0.0</b> done</span>
      <span class="live"><b id="lvLeft">–</b> left</span>
      <span class="live"><b id="lvTime">0:00</b></span>
    </div>
  </header>
  <div id="map"></div>
  <div id="elev">
    <canvas id="elevCanvas"></canvas>
    <span id="elevLabel">Elevation</span>
    <div id="posMarker"></div>
  </div>
  <nav class="actions">
    <label class="btn" id="gpxLabel">Load GPX<input type="file" id="gpxInput" accept=".gpx,application/gpx+xml,application/octet-stream"></label>
    <button class="btn" id="btnFollow">▶ Start ride</button>
    <button class="btn" id="btnGmaps">Maps</button>
  </nav>
  <div id="toast"></div>
  <div id="startNav"><span id="startNavDist"></span> to the start point<small>Tap to navigate there with Google Maps</small></div>
  <div id="offBanner">⚠ OFF ROUTE — <span id="offDist"></span> from track</div>
  <div id="flash"></div>
  <div id="summary"><div class="card">
    <h2>Ride complete</h2>
    <div class="row"><span>Distance ridden</span><b id="smDist">–</b></div>
    <div class="row"><span>Time</span><b id="smTime">–</b></div>
    <div class="row"><span>Average speed</span><b id="smAvg">–</b></div>
    <div class="row"><span>Route covered</span><b id="smCov">–</b></div>
    <button class="btn" id="smClose">Close</button>
  </div></div>
</div>

let ROUTE_NAME="Uncle Jefferey & Brother Beacon";
let HIGH_LABEL="Beacon Fell";

// --- Map ---
const map = L.map('map',{zoomControl:false});
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, attribution:'© OpenStreetMap'
}).addTo(map);

function haversine(a,b){
  const R=6371000,rad=x=>x*Math.PI/180;
  const dLa=rad(b[0]-a[0]),dLo=rad(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

const startIcon = L.divIcon({html:'<div style="background:#ffb300;color:#1a2420;font-weight:800;font-size:11px;padding:3px 7px;border-radius:6px;border:2px solid #1a2420;white-space:nowrap">START / FINISH</div>',iconAnchor:[40,12],className:''});
function highIcon(name){return L.divIcon({html:'<div style="background:#1a2420;color:#ffb300;font-weight:800;font-size:11px;padding:3px 7px;border-radius:6px;border:2px solid #ffb300;white-space:nowrap">▲ '+name.toUpperCase()+'</div>',iconAnchor:[45,12],className:''})}

let casingLine=null,routeLine=null,startMarker=null,highMarker=null;
let cum=[0],totalDist=0,totalClimb=0,highPt=null;

function buildRoute(fit){
  [casingLine,routeLine,startMarker,highMarker].forEach(l=>{if(l)map.removeLayer(l)});
  const latlngs=PTS.map(p=>[p[0],p[1]]);
  casingLine=L.polyline(latlngs,{color:'#1a2420',weight:8,opacity:.55}).addTo(map);
  routeLine=L.polyline(latlngs,{color:'#ff6d00',weight:4}).addTo(map);
  startMarker=L.marker(latlngs[0],{icon:startIcon}).addTo(map);
  cum=[0];
  for(let i=1;i<PTS.length;i++) cum.push(cum[i-1]+haversine(PTS[i-1],PTS[i]));
  totalDist=cum[cum.length-1];
  // smoothed climb + high point
  const sm=PTS.map((p,i)=>{
    let s=0,n=0;
    for(let j=Math.max(0,i-2);j<=Math.min(PTS.length-1,i+2);j++){s+=PTS[j][2];n++}
    return s/n;
  });
  totalClimb=0;let hi=0;
  for(let i=1;i<sm.length;i++){const d=sm[i]-sm[i-1];if(d>0)totalClimb+=d;if(PTS[i][2]>PTS[hi][2])hi=i}
  highPt=PTS[hi];
  highMarker=L.marker([highPt[0],highPt[1]],{icon:highIcon(HIGH_LABEL)}).addTo(map);
  if(fit)map.fitBounds(routeLine.getBounds(),{padding:[20,20]});
  drawElev();
  document.getElementById('routeName').textContent=ROUTE_NAME;
  document.getElementById('stTotal').textContent=(totalDist/1000).toFixed(1);
  document.getElementById('stClimb').textContent=Math.round(totalClimb);
  document.getElementById('stHigh').textContent=HIGH_LABEL+' '+Math.round(highPt[2])+' m';
  document.title=ROUTE_NAME+' · Beacon Ride Navigator';
}

// --- Elevation profile ---
const cv=document.getElementById('elevCanvas'),ctx=cv.getContext('2d');
function drawElev(){
  const w=cv.clientWidth*devicePixelRatio,h=cv.clientHeight*devicePixelRatio;
  cv.width=w;cv.height=h;
  const eles=PTS.map(p=>p[2]);
  const mn=Math.min(...eles),mx=Math.max(...eles),span=mx-mn||1;
  ctx.clearRect(0,0,w,h);
  ctx.beginPath();ctx.moveTo(0,h);
  for(let i=0;i<PTS.length;i++){
    ctx.lineTo(cum[i]/totalDist*w, h-((PTS[i][2]-mn)/span)*(h*0.78)-h*0.08);
  }
  ctx.lineTo(w,h);ctx.closePath();
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#ffb300');g.addColorStop(1,'rgba(255,179,0,0.08)');
  ctx.fillStyle=g;ctx.fill();
}
addEventListener('resize',drawElev);

// --- Toast ---
let toastT;
function toast(msg,ms=3500){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',ms);
}
function vibrate(p){if(navigator.vibrate)navigator.vibrate(p)}
function flash(kind){
  const f=document.getElementById('flash');
  f.className='';void f.offsetWidth;f.className=kind;
}

// --- Navigate to start ---
const START_RADIUS=250;
let atStart=false, toStartLine=null;
const startNav=document.getElementById('startNav');
startNav.addEventListener('click',()=>{
  const s=PTS[0];
  const url='https://www.google.com/maps/dir/?api=1&destination='+s[0]+','+s[1]+'&travelmode=bicycling';
  window.open(url,'_blank');
});
function updateStartGuide(la,lo){
  if(atStart) return;
  const d=haversine([la,lo],PTS[0]);
  if(d<=START_RADIUS){
    atStart=true;
    startNav.style.display='none';
    if(toStartLine){map.removeLayer(toStartLine);toStartLine=null}
    vibrate([100,60,100]);
    toast('You\'ve reached the start — ride on! 🚴');
    return;
  }
  startNav.style.display='block';
  document.getElementById('startNavDist').textContent=
    d>=1000?(d/1000).toFixed(1)+' km':Math.round(d)+' m';
  if(!toStartLine){
    toStartLine=L.polyline([[la,lo],[PTS[0][0],PTS[0][1]]],
      {color:'#ffb300',weight:3,dashArray:'6 8',opacity:.9}).addTo(map);
  } else {
    toStartLine.setLatLngs([[la,lo],[PTS[0][0],PTS[0][1]]]);
  }
}
function resetStartGuide(){
  atStart=false;
  startNav.style.display='none';
  if(toStartLine){map.removeLayer(toStartLine);toStartLine=null}
}

// --- Nearest point on route ---
function nearest(la,lo){
  let best=0,bd=Infinity;
  for(let i=0;i<PTS.length;i+=3){
    const d=(PTS[i][0]-la)**2+(PTS[i][1]-lo)**2;
    if(d<bd){bd=d;best=i}
  }
  let idx=best,md=Infinity;
  for(let i=Math.max(0,best-3);i<=Math.min(PTS.length-1,best+3);i++){
    const d=haversine([la,lo],PTS[i]);
    if(d<md){md=d;idx=i}
  }
  return {idx,dist:md};
}

// --- Off-track detection ---
const OFF_M=40;
let offState=false,offN=0,onN=0;
const offBanner=document.getElementById('offBanner');
function checkTrack(dist,ac){
  const th=Math.max(OFF_M,ac*1.2);
  if(!offState){
    if(dist>th){offN++;if(offN>=2){
      offState=true;offN=0;
      flash('red');vibrate([350,150,350,150,350]);
      offBanner.style.display='block';
      document.getElementById('offDist').textContent=dist>=1000?(dist/1000).toFixed(1)+' km':Math.round(dist)+' m';
    }}else offN=0;
  } else {
    document.getElementById('offDist').textContent=dist>=1000?(dist/1000).toFixed(1)+' km':Math.round(dist)+' m';
    if(dist<th*0.6){onN++;if(onN>=2){
      offState=false;onN=0;
      offBanner.style.display='none';
      flash('green');vibrate([80,60,80]);
      toast('Back on route ✓');
    }}else onN=0;
  }
}

// --- Wake lock ---
let wakeLock=null;
async function keepAwake(){
  try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}
}
function releaseWake(){if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}}
document.addEventListener('visibilitychange',()=>{
  if(watchId!==null&&document.visibilityState==='visible')keepAwake();
});

// --- Follow-me live tracking + ride stats ---
let watchId=null, meMarker=null, accCircle=null;
let rideStart=0, ridden=0, lastFix=null, clockT=null, maxIdx=0;
const btnF=document.getElementById('btnFollow');

function fmtTime(s){
  s=Math.round(s);
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h?h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'):m+':'+String(x).padStart(2,'0');
}

function stopFollowing(showSummary){
  if(watchId===null)return;
  navigator.geolocation.clearWatch(watchId);watchId=null;
  clearInterval(clockT);clockT=null;
  releaseWake();
  btnF.textContent='▶ Start ride';btnF.classList.remove('on');
  document.getElementById('hdr').classList.remove('riding');
  document.getElementById('posMarker').style.display='none';
  offBanner.style.display='none';offState=false;offN=0;onN=0;
  if(meMarker){map.removeLayer(meMarker);meMarker=null}
  if(accCircle){map.removeLayer(accCircle);accCircle=null}
  resetStartGuide();
  const elapsed=(Date.now()-rideStart)/1000;
  if(showSummary&&rideStart&&ridden>200&&elapsed>60){
    document.getElementById('smDist').textContent=(ridden/1000).toFixed(1)+' km';
    document.getElementById('smTime').textContent=fmtTime(elapsed);
    document.getElementById('smAvg').textContent=(ridden/1000/(elapsed/3600)).toFixed(1)+' km/h';
    document.getElementById('smCov').textContent=Math.min(100,Math.round(cum[maxIdx]/totalDist*100))+'%';
    document.getElementById('summary').style.display='flex';
  }
  rideStart=0;ridden=0;lastFix=null;maxIdx=0;
}
document.getElementById('smClose').addEventListener('click',()=>{
  document.getElementById('summary').style.display='none';
});

btnF.addEventListener('click',()=>{
  if(watchId!==null){stopFollowing(true);return}
  if(!navigator.geolocation){toast('Location not supported on this device');return}
  toast('Locating you…',10000);
  btnF.textContent='■ Stop ride';btnF.classList.add('on');
  document.getElementById('hdr').classList.add('riding');
  rideStart=Date.now();ridden=0;lastFix=null;maxIdx=0;
  keepAwake();
  clockT=setInterval(()=>{
    document.getElementById('lvTime').textContent=fmtTime((Date.now()-rideStart)/1000);
  },1000);
  watchId=-1;
  function onFix(pos){
    const {latitude:la,longitude:lo,accuracy:ac}=pos.coords;
    if(!meMarker){
      meMarker=L.circleMarker([la,lo],{radius:9,color:'#fff',weight:3,fillColor:'#2979ff',fillOpacity:1}).addTo(map);
      accCircle=L.circle([la,lo],{radius:ac,color:'#2979ff',weight:1,fillOpacity:.08}).addTo(map);
      map.setView([la,lo],15);
      toast('Following you — ride safe');
    } else {
      meMarker.setLatLng([la,lo]);
      accCircle.setLatLng([la,lo]).setRadius(ac);
      map.panTo([la,lo],{animate:true});
    }
    // ridden distance (jump-filtered)
    if(ac<60){
      if(lastFix){
        const seg=haversine(lastFix,[la,lo]);
        const dt=(Date.now()-lastFix[2])/1000;
        if(seg<Math.max(150,dt*30)) ridden+=seg;
      }
      lastFix=[la,lo,Date.now()];
    }
    updateStartGuide(la,lo);
    const {idx,dist}=nearest(la,lo);
    if(idx>maxIdx)maxIdx=idx;
    document.getElementById('lvDone').textContent=(cum[idx]/1000).toFixed(1);
    document.getElementById('lvLeft').textContent=((totalDist-cum[idx])/1000).toFixed(1);
    const pm=document.getElementById('posMarker');
    pm.style.display='block';
    pm.style.left=(cum[idx]/totalDist*100)+'%';
    if(atStart) checkTrack(dist,ac);
  }
  // 1) Instant coarse fix (wifi/network)
  navigator.geolocation.getCurrentPosition(onFix,()=>{},
    {enableHighAccuracy:false,maximumAge:120000,timeout:8000});
  // 2) Precise GPS tracking — patient, keeps trying on timeout
  watchId=navigator.geolocation.watchPosition(onFix,err=>{
    if(err.code===1){
      toast('Location blocked — tap the icon left of the address bar → Permissions → Location → Allow, then refresh');
      stopFollowing(false);
    } else if(err.code===2){
      toast('No location signal — check phone Location is ON and Google Location Accuracy is enabled',6000);
    } else {
      toast('Still searching for GPS — works best outdoors or near a window',6000);
    }
  },{enableHighAccuracy:true,maximumAge:3000,timeout:30000});
});

// --- Load any GPX ---
document.getElementById('gpxInput').addEventListener('change',e=>{
  const f=e.target.files[0];
  if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const xml=new DOMParser().parseFromString(rd.result,'text/xml');
      if(xml.getElementsByTagName('parsererror').length)throw 0;
      let nodes=xml.getElementsByTagName('trkpt');
      if(!nodes.length)nodes=xml.getElementsByTagName('rtept');
      if(nodes.length<2){toast('No track found in that GPX file');return}
      let np=[];
      for(let i=0;i<nodes.length;i++){
        const n=nodes[i];
        const la=parseFloat(n.getAttribute('lat')),lo=parseFloat(n.getAttribute('lon'));
        if(isNaN(la)||isNaN(lo))continue;
        const el=n.getElementsByTagName('ele');
        np.push([la,lo,el.length?parseFloat(el[0].textContent)||0:0]);
      }
      if(np.length<2){toast('No usable points in that GPX file');return}
      if(np.length>4000){
        const step=Math.ceil(np.length/4000),ds=[];
        for(let i=0;i<np.length;i+=step)ds.push(np[i]);
        if(ds[ds.length-1]!==np[np.length-1])ds.push(np[np.length-1]);
        np=ds;
      }
      let nm='';
      const nEls=xml.getElementsByTagName('name');
      if(nEls.length)nm=nEls[0].textContent.trim();
      stopFollowing(false);
      PTS=np;
      ROUTE_NAME=nm||f.name.replace(/\.gpx$/i,'');
      HIGH_LABEL='High point';
      buildRoute(true);
      toast('Loaded: '+ROUTE_NAME);
    }catch(err){
      toast('Couldn\'t read that file — is it a valid GPX export?');
    }
  };
  rd.onerror=()=>toast('Couldn\'t open that file');
  rd.readAsText(f);
  e.target.value='';
});

// --- Google Maps export (simplified waypoints) ---
document.getElementById('btnGmaps').addEventListener('click',()=>{
  const N=9;
  const picks=[];
  for(let i=1;i<=N;i++) picks.push(PTS[Math.round(i*(PTS.length-1)/(N+1))]);
  const o=PTS[0],d=PTS[PTS.length-1];
  const url='https://www.google.com/maps/dir/?api=1'
    +'&origin='+o[0]+','+o[1]
    +'&destination='+d[0]+','+d[1]
    +'&waypoints='+picks.map(p=>p[0]+','+p[1]).join('|')
    +'&travelmode=bicycling';
  toast('Opening Google Maps — route is simplified to key points; Google may reroute between them');
  setTimeout(()=>window.open(url,'_blank'),600);
});

buildRoute(true);
</script>
